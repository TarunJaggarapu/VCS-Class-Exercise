<html>
<head>
    <title>Find My Location</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #eef4f8;
        }

        .container {
            background-color: white;
            padding: 25px;
            max-width: 700px;
            border: 1px solid #b8c7d1;
        }

        h1 {
            color: #1f4e79;
        }

        input[type="text"] {
            width: 400px;
            padding: 8px;
        }

        select {
            width: 300px;
            padding: 7px;
        }

        input[type="button"] {
            padding: 7px 15px;
            margin-left: 5px;
        }

        #submit_address {
            background-color: #1f4e79;
            color: white;
        }

        #clear_address {
            background-color: #eeeeee;
        }

        #location_results {
            margin-top: 25px;
            padding: 15px;
            background-color: #f7fafc;
            border-top: 3px solid #1f4e79;
        }

        #map_content {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Find My Location</h1>

        <p>Below, enter your full street address, including your city, state and zip code.</p>

        <input id="address" type="text" placeholder="Enter your full address">

        <p>Choose a Census Bureau address data source:</p>

        <select id="addressSources"></select>

        <input id="submit_address" type="button" value="Submit">
        <input id="clear_address" type="button" value="Clear">

        <div id="location_results" hidden>
            <p><b>Matched Address:</b> <span id="matched_address"></span></p>
            <p><b>Latitude:</b> <span id="latitude"></span></p>
            <p><b>Longitude:</b> <span id="longitude"></span></p>
            <div id="map_content"></div>
        </div>

    </div>

    <script type="text/javascript" src="exercise2.js"></script>

</body>
</html>
